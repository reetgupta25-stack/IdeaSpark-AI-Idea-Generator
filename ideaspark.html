<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea Spark</title>
    <link rel="stylesheet" href="ideaspark.css">
</head>
<body>
    <main class="card">
        <div class="icon">✦</div>
        <h1>Idea Spark</h1>
        <p class="subtitle">Turn your curiosity into creative ideas.</p>
        <textarea id="inputText" placeholder="Enter a topic..." rows="5"></textarea>
        <button id="generateBtn">Generate Ideas <span>→</span></button>
        <h3>Generated Ideas</h3>
        <div id="output">Your ideas will appear here.</div>
    </main>
    <script src="ideasparrk.js"></script>
</body>
</html>
